version: "3.8"

services:
  customer-service:
    build: .
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-local}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:8080}
      - USE_SQLITE=1
    volumes:
      - ./knowledge:/app/knowledge:ro
      - checkpoints:/app/checkpoints
    restart: unless-stopped

volumes:
  checkpoints:
