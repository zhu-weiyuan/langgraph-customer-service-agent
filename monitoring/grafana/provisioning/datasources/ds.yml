# Grafana datasource provisioning
# Mounted via ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
