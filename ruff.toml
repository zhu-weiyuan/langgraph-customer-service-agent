# Ruff configuration for langgraph-customer-service-agent

target-version = "py311"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B905",   # zip() without strict argument
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are acceptable

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
